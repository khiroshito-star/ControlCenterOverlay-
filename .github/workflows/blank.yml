name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassControlCenter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassControlCenter
          path: GlassControlCenter.apk
      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          body: Newest build of Glass Control Center. Download GlassControlCenter.apk and install it.
          files: GlassControlCenter.apk
          make_latest: true
